<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloit RAG Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div>
                <h1>Veloit RAG</h1>
                <p>Simple local chat</p>
            </div>

            <div class="topbar-right">
                <div class="ring-wrap">
                    <svg class="ring" width="54" height="54" viewBox="0 0 54 54">
                        <circle class="ring-bg" cx="27" cy="27" r="22"></circle>
                        <circle class="ring-progress" id="ring-progress" cx="27" cy="27" r="22"></circle>
                    </svg>
                    <div class="ring-label" id="ring-label">0%</div>
                </div>
                <div class="status" id="status">Ready</div>
            </div>
        </header>

        <main class="layout">
            <section class="chat-shell">
                <div id="voice-bar" class="voice-bar hidden">
                    <div class="voice-bar-left">
                        <span class="voice-dot" id="voice-dot"></span>
                        <span class="voice-state-text" id="voice-state-text">Listening...</span>
                    </div>
                    <div class="voice-wave" id="voice-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <button type="button" id="voice-cancel-btn" class="voice-stop-btn">Exit Voice</button>
                </div>

                <div id="chat" class="chat"></div>

                <form id="chat-form" class="composer">
                    <input id="message" type="text" placeholder="Ask something..." autocomplete="off" required />
                    <button type="button" id="voice-toggle-btn" class="mic-btn" title="Toggle Voice Mode" aria-label="Toggle Voice Mode">
                        <svg class="mic-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button type="submit">Send</button>
                    <button type="button" id="reset-btn" class="ghost-btn">Reset</button>
                </form>
            </section>

            <aside class="debug-panel">
                <div class="debug-header">
                    <h2>Debug</h2>
                    <label class="toggle">
                        <input type="checkbox" id="debug-toggle" checked />
                        <span>On</span>
                    </label>
                </div>

                <div class="debug-block">
                    <div class="debug-kv"><span>Status</span><span id="dbg-status">Idle</span></div>
                    <div class="debug-kv"><span>Top score</span><span id="dbg-score">-</span></div>
                    <div class="debug-kv"><span>Chunks</span><span id="dbg-chunks">-</span></div>
                    <div class="debug-kv"><span>History msgs</span><span id="dbg-history">-</span></div>
                    <div class="debug-kv"><span>Context chars</span><span id="dbg-context">-</span></div>
                    <div class="debug-kv"><span>Session chars</span><span id="dbg-session">-</span></div>
                </div>

                <div class="debug-block">
                    <h3>Retrieved chunks</h3>
                    <div id="debug-chunks" class="debug-list"></div>
                </div>

                <div class="debug-block">
                    <h3>Context preview</h3>
                    <pre id="debug-context" class="debug-context">No request yet.</pre>
                </div>
            </aside>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
